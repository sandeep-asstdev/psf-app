# ================================================================================
# FILE PURPOSE:
# Multi-Container Docker Orchestration for the PSF (Post-Service Follow-up) System.
# Defines and runs all 6 local services required by the dealership platform:
# 1. psf_postgres (Database on port 5434)
# 2. psf_redis    (In-memory Cache & WebSocket message broker on port 6380)
# 3. psf_minio    (S3 Object Storage for files & reports on port 9000/9001)
# 4. psf_api      (FastAPI Backend Server on port 8000)
# 5. psf_worker   (Asynchronous Background Task Runner)
# 6. psf_web      (Nginx Web Server hosting the React Vite Frontend on port 5173)
#
# COMMON ERRORS & TROUBLESHOOTING GUIDE:
# - Error: Port 5434 / 6380 / 8000 / 5173 already in use / bind failed
#   -> Cause: Another container or local process is already using that port.
#   -> What should you do: Run `netstat -ano | findstr <PORT>` or check docker containers (`docker ps`). Stop conflicting containers.
# - Error: Container keeps restarting or healthcheck failing
#   -> Cause: Database or Redis crashed or wrong password in .env.
#   -> What should you do: Run `docker compose logs <service_name>` (e.g. `docker compose logs api`) to see the exact crash stack trace.
# - How to restart fresh:
#   -> Run `docker compose restart` to restart all containers, or `docker compose down && docker compose up -d` to rebuild.
# ================================================================================

services:
  postgres:
    image: postgres:18-alpine
    container_name: psf_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-psf_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-psf_secure_password_dev}
      POSTGRES_DB: ${POSTGRES_DB:-psf_db}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-psf_admin} -d ${POSTGRES_DB:-psf_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: psf_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: dograhai/minio:2026.09.22
    container_name: psf_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: psf_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-psf_admin}:${POSTGRES_PASSWORD:-psf_secure_password_dev}@postgres:5432/${POSTGRES_DB:-psf_db}
      SYNC_DATABASE_URL: postgresql://${POSTGRES_USER:-psf_admin}:${POSTGRES_PASSWORD:-psf_secure_password_dev}@postgres:5432/${POSTGRES_DB:-psf_db}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: psf_worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-psf_admin}:${POSTGRES_PASSWORD:-psf_secure_password_dev}@postgres:5432/${POSTGRES_DB:-psf_db}
      SYNC_DATABASE_URL: postgresql://${POSTGRES_USER:-psf_admin}:${POSTGRES_PASSWORD:-psf_secure_password_dev}@postgres:5432/${POSTGRES_DB:-psf_db}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
    volumes:
      - ./backend:/app
    command: python -m app.workers.runner

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: psf_web
    restart: unless-stopped
    ports:
      - "5173:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
      - VITE_WS_BASE_URL=ws://localhost:8000/api/v1/ws

volumes:
  postgres_data:
    name: psf_postgres_data
  redis_data:
    name: psf_redis_data
  minio_data:
    name: psf_minio_data
